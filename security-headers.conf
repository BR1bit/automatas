# Cabeceras de seguridad básicas. Sin Content-Security-Policy a propósito:
# el sitio embebe un iframe de Google Calendar y linkea a wa.me/mailto —
# una CSP mal ajustada rompe eso en silencio, y no vale la pena el riesgo
# sin necesidad concreta.
#
# Se incluye con "include" en vez de ponerlo una sola vez a nivel server:
# en nginx, un location que define su propio add_header (acá, los que
# ponen Cache-Control) deja de heredar los add_header del server — no se
# suman, se reemplazan. Este archivo se repite explícitamente en cada
# location que tiene su propio add_header, así nunca queda un location
# sirviendo estas cabeceras "por accidente" de una herencia que en
# realidad no aplica.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

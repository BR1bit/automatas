# Config del nginx que sirve el sitio DENTRO del contenedor. No es el
# proxy inverso de la VM: eso vive afuera, en tu nginx/Tailscale/AWS, y le
# apunta a este contenedor por red de Docker o por el puerto publicado
# (ver docker-compose.yml y la sección "Desplegar con Docker" del README).

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El proxy inverso de adelante ya resuelve el dominio real; acá alcanza
    # con no filtrar server_name para no tener que mantenerlo sincronizado.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/ld+json
        image/svg+xml
        font/woff2;

    # Ver snippets/security-headers.conf: hay que incluirlo en cada
    # location que define su propio add_header (add_header no hereda del
    # server una vez que un location pone el suyo), y acá abajo a nivel
    # server para que lo tomen /healthz y cualquier location sin
    # add_header propio. Ruta absoluta: fuera de conf.d/ a propósito, para
    # que el include *.conf de nginx.conf no lo cargue dos veces.
    include /etc/nginx/snippets/security-headers.conf;

    # Fuentes y SVG de marca: no cambian salvo que se rehaga el diseño, así
    # que se cachean fuerte. El resto (HTML, CSS, JS) cachea poco: el sitio
    # cambia seguido en esta etapa y priorizamos ver la versión nueva.
    location /fuentes/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.svg$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # demo/panel.html y demo/aprobaciones.html ya llevan su propio
    # <meta name="robots" content="noindex"> en el HTML; robots.txt cubre
    # el resto.
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Health check para el HEALTHCHECK del contenedor y para que el proxy
    # de adelante pueda chequear que está vivo sin pegarle a una página real.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

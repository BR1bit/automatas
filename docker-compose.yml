services:
  automatas-landing:
    build: .
    container_name: automatas-landing
    restart: unless-stopped

    # --- Cómo conectarlo a tu nginx de la VM ---
    #
    # Opción A: tu nginx también corre en un contenedor, en la misma red
    # Docker que este servicio. Es la opción más prolija cuando "otros
    # servicios" ya viven en contenedores: nada queda expuesto al host, y
    # tu nginx le pega por nombre.
    #
    #   1. Descomentá el bloque "networks" de acá abajo y poné el nombre
    #      real de tu red (`docker network ls` para verla).
    #   2. En tu nginx, agregá un server block:
    #        location / {
    #            proxy_pass http://automatas-landing:80;
    #            proxy_set_header Host $host;
    #            proxy_set_header X-Real-IP $remote_addr;
    #            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #            proxy_set_header X-Forwarded-Proto $scheme;
    #        }
    #
    # networks:
    #   - proxy   # <- cambiar por el nombre real de tu red compartida
    #
    # Opción B: tu nginx corre directo en el host (no en Docker). Publicá
    # el puerto atado a localhost (no a 0.0.0.0, para no exponerlo por
    # fuera de la VM) y apuntale desde ahí:
    #
    #   ports:
    #     - "127.0.0.1:8080:80"
    #
    #   Y en tu nginx del host:
    #     location / {
    #         proxy_pass http://127.0.0.1:8080;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

